<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTTSSSS - 雲端 BBS 版</title>
    <style>
        /* PTT 復古配色與字體 */
        body { background-color: #000; color: #bbb; font-family: "Courier New", Courier, monospace, "微軟正黑體"; margin: 0; overflow: hidden; }
        #app { display: flex; height: 100vh; width: 100vw; }
        
        /* 左側列表區 */
        #sidebar { width: 300px; border-right: 1px solid #444; display: flex; flex-direction: column; background: #000; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #444; text-align: center; }
        #post-list { flex-grow: 1; overflow-y: auto; }
        .post-item { padding: 12px 15px; border-bottom: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .post-item:hover { background-color: #1a1a1a; color: #fff; }
        .post-item .meta { font-size: 11px; color: #555; margin-bottom: 4px; }
        .post-item .title { font-size: 14px; color: #ccc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 右側主顯示區 */
        #main-content { flex-grow: 1; padding: 40px; overflow-y: auto; background: #000; }
        .btn { background: #000; color: #00aaaa; border: 1px solid #00aaaa; padding: 6px 16px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #00aaaa; color: #000; }
        
        /* 閱讀與發文介面 */
        #post-view, #post-form { max-width: 900px; margin: 0 auto; }
        h1 { color: #fff; font-size: 24px; margin-bottom: 5px; }
        .info-bar { color: #888; font-size: 13px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        pre { white-space: pre-wrap; word-wrap: break-word; line-height: 1.8; font-size: 16px; color: #ddd; }
        
        /* 表單樣式 */
        input, textarea { width: 100%; background: #000; color: #fff; border: 1px solid #444; padding: 12px; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; }
        input:focus, textarea:focus { border-color: #00aaaa; outline: none; }
        
        /* 捲軸美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</head>
<body>

<div id="app">
    <div id="sidebar">
        <div class="sidebar-header">
            <h2 style="color: #ffff00; margin-bottom: 15px;">BBS 佈告欄</h2>
            <button class="btn" onclick="showForm()">＋ 發表文章</button>
        </div>
        <div id="post-list">載入中...</div>
    </div>

    <div id="main-content">
        <div id="post-view">
            <h1 id="view-title">歡迎來到 PTTSSSS</h1>
            <div id="view-meta" class="info-bar">點選左側文章開始閱讀</div>
            <pre id="view-content">這是一個基於 Firebase 雲端同步的 BBS 系統。
你發佈的所有內容，全世界的使用者都能即時看到。

※ 注意：請維持良好的討論禮儀。</pre>
        </div>

        <div id="post-form" style="display:none;">
            <h2 style="color: #00aaaa;">發表新文章</h2>
            <input type="text" id="title-input" placeholder="文章標題">
            <input type="text" id="author-input" placeholder="您的暱稱">
            <textarea id="content-input" rows="12" placeholder="請在此輸入內容..."></textarea>
            <div style="text-align: right;">
                <button class="btn" style="border-color: #888; color: #888;" onclick="hideForm()">取消</button>
                <button class="btn" id="submit-btn" style="margin-left: 10px;">正式發佈</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 已經替換為你提供的 Firebase 配置
    const firebaseConfig = {
        apiKey: "AIzaSyCEhuXeni3y7CQY7ha_NiDv6yX6shX__M0",
        authDomain: "bbbss-61944.firebaseapp.com",
        projectId: "bbbss-61944",
        storageBucket: "bbbss-61944.firebasestorage.app",
        messagingSenderId: "116774055764",
        appId: "1:116774055764:web:164c9a97b199c1e9a7a2c1",
        measurementId: "G-DS01925NVS",
        databaseURL: "https://bbbss-61944-default-rtdb.firebaseio.com"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const postsRef = ref(db, 'posts');

    // 1. 監聽雲端資料並即時渲染列表
    onValue(postsRef, (snapshot) => {
        const postList = document.getElementById('post-list');
        postList.innerHTML = "";
        const data = snapshot.val();

        if (data) {
            // 轉換為陣列並按時間排序（新的貼文在最上方）
            const posts = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            })).sort((a, b) => b.timestamp - a.timestamp);

            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'post-item';
                item.innerHTML = `
                    <div class="meta">● ${post.author} (${new Date(post.timestamp).toLocaleDateString()})</div>
                    <div class="title">${post.title}</div>
                `;
                item.onclick = () => renderPost(post);
                postList.appendChild(item);
            });
        } else {
            postList.innerHTML = "<div style='padding:20px; color:#555;'>目前尚無看板資料</div>";
        }
    });

    // 2. 提交按鈕邏輯：發佈到雲端
    document.getElementById('submit-btn').addEventListener('click', () => {
        const title = document.getElementById('title-input').value;
        const author = document.getElementById('author-input').value || "匿名人士";
        const content = document.getElementById('content-input').value;

        if (!title || !content) return alert("標題或內容不可為空！");

        const newPostRef = push(postsRef);
        set(newPostRef, {
            title,
            author,
            content,
            timestamp: Date.now()
        }).then(() => {
            // 清空輸入並隱藏表單
            document.getElementById('title-input').value = "";
            document.getElementById('author-input').value = "";
            document.getElementById('content-input').value = "";
            hideForm();
        }).catch(err => alert("發布失敗，請確認 Firebase Rules 是否設為 true：" + err));
    });

    // UI 控制功能
    window.renderPost = (post) => {
        hideForm();
        document.getElementById('view-title').innerText = post.title;
        document.getElementById('view-meta').innerText = `作者: ${post.author}  |  時間: ${new Date(post.timestamp).toLocaleString()}`;
        document.getElementById('view-content').innerText = post.content;
    };

    window.showForm = () => {
        document.getElementById('post-view').style.display = 'none';
        document.getElementById('post-form').style.display = 'block';
    };

    window.hideForm = () => {
        document.getElementById('post-view').style.display = 'block';
        document.getElementById('post-form').style.display = 'none';
    };
</script>

</body>
</html>
